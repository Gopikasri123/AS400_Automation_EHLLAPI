# =====================================================================
#  PUB400 CRUD Automation Framework - configuration
#  Edit the values below. The password is NOT stored here: it is read
#  from the PUB400_PASSWORD environment variable at run time.
# =====================================================================

[connection]
session = A
host    = pub400.com
user    = GOPIKAS
password = pub1234

[database]
library = GOPIKAS1
table   = USERS
key_column      = USER_ID
# numeric columns are written unquoted in SQL and compared without separators
numeric_columns = USER_ID

[emulator]
dll_path = C:\Program Files (x86)\IBM\EHLLAPI\64\pcshll32.dll
dll_dirs = C:\Program Files (x86)\IBM\EHLLAPI\64, C:\Program Files (x86)\IBM\EHLLAPI
screen_size = 24x80
autodetect  = true

[launch]
# If session A is not already open, start it from this saved ACS 5250 session
# file (in the emulator: File > Save As... > Desktop\A.hod).
auto_launch    = true
session_file   = C:\Users\UTIS LAPTOP 174\Desktop\A.hod
launcher       = C:\Users\UTIS LAPTOP 174\Downloads\IBMiAccess_v1r1\Start_Programs\Windows_x86-64\acslaunch_win-64.exe
# seconds to wait for the launched session to come up and show a screen
launch_timeout = 90
# restore the emulator window and bring it to the front so the run is visible
show_window    = true
# maximize the emulator window to full screen (the 24x80 text scales up to fit)
maximize_window = true
# step 11: close the emulator window after signing off
close_emulator = true

[runtime]
# slowmo: seconds paused after each action so you can watch (0 = full speed)
slowmo        = 1.0
trace         = true
wait_retries  = 8
wait_interval = 0.4
report_dir    = reports
data_dir      = data
# test data management file (under data_dir) that drives the USERS CRUD flow
test_data     = users_testdata.csv
